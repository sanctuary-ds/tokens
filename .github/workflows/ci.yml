name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (development runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm from packageManager and the Node.js from devEngines.runtime, then runs pnpm install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Check that generated files match the sources
        run: pnpm run check

  minimum-node:
    name: Test (minimum supported Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The oldest Node.js that devEngines.runtime in package.json accepts: 24, the active LTS line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.0.0
      # This job has no pnpm, so the tests that pack the package skip; the job above runs them.
      - run: node --run test
        env:
          SANCTUARY_NO_PNPM: 1
