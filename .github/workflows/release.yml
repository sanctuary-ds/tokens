name: Release

# Publishes @sanctuary-ds/tokens to npm when a version tag such as v0.1.1 is pushed.
# Nothing else triggers it: pushes and merges to main never publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      # Installs the pnpm from packageManager and the Node.js from devEngines.runtime, then runs pnpm install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi
      # Includes the package contents test, which needs pnpm.
      - run: pnpm test
      - name: Check that generated files match the sources
        run: pnpm run check
      - name: Check that the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    # The npm environment requires a maintainer's approval, and the npm trusted publisher only accepts runs from it.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: npm exchanges this OIDC token for a one-time credential,
    # so no npm token is stored in the repository. Provenance is generated automatically.
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish exactly the commit the verify job tested, even if the tag moved since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The job never pushes, so the GitHub token is not left in the git config.
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers); the npm bundled with Node 24 meets it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm publish
